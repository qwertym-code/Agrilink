<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Agrilink — fresh produce, straight from the farmer to your table." />
    <meta name="theme-color" content="#0b3d24" />
    <title>Agrilink — Farmers Marketplace</title>

    <!--
      Fraunces carries the "grown, not manufactured" feel for headings; Inter
      keeps the interface legible at small sizes. display=swap so text paints
      immediately rather than flashing invisible while fonts load.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Bootstrap only themes its own components when this attribute is set,
      // and CSS media queries can't set attributes. Runs before paint so there
      // is no light flash on a dark device.
      (function () {
        var dark = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function (isDark) {
          document.documentElement.setAttribute('data-bs-theme', isDark ? 'dark' : 'light');
        };
        apply(dark.matches);
        dark.addEventListener('change', function (e) { apply(e.matches); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
