<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Agrilink — fresh produce, straight from the farmer to your table." />
    <meta name="theme-color" content="#0b3d24" />
    <title>Agrilink — Farmers Marketplace</title>

    <!--
      Three roles, none of them the default pairing:
        Bricolage Grotesque — display. Slightly irregular, signwriter-ish;
          market signage is painted sans, not editorial serif.
        Public Sans         — body. A plain civic workhorse.
        Space Grotesk       — numerals only. Mechanical digits for the price
          boards, the one place this interface should feel like equipment.
      display=swap so text paints immediately instead of flashing invisible.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Bootstrap only themes its own components when this attribute is set,
      // and CSS media queries can't set attributes. This runs before paint so
      // a saved preference never flashes the wrong theme first — React mounts
      // too late to prevent that, which is why it isn't done there.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('agrilink_theme'); } catch (e) {}

        var explicit = saved === 'light' || saved === 'dark';
        var dark = window.matchMedia('(prefers-color-scheme: dark)');
        var theme = explicit ? saved : (dark.matches ? 'dark' : 'light');

        document.documentElement.setAttribute('data-bs-theme', theme);

        // Only follow the OS while no explicit choice is stored. Once the app
        // mounts, ThemeContext takes over.
        if (!explicit) {
          dark.addEventListener('change', function (e) {
            document.documentElement.setAttribute('data-bs-theme', e.matches ? 'dark' : 'light');
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
