# Render blueprint for the Agrilink API.
# The React client deploys separately to Vercel — see DEPLOY.md.
services:
  - type: web
    name: agrilink-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start

    # Render restarts the service if this stops answering.
    healthCheckPath: /api/health

    envVars:
      # sync:false means Render prompts for the value instead of storing it
      # in this file — the connection string must never be committed.
      - key: MONGO_URI
        sync: false

      # Generated by Render and never seen by anyone, which is exactly what a
      # signing secret should be.
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      # Your Vercel URL. Comma-separate to allow more than one origin.
      - key: CLIENT_URL
        sync: false

      # Set to "true" only if you want Vercel preview deploys to reach the API.
      - key: ALLOW_VERCEL_PREVIEWS
        value: "false"
